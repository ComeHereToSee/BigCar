# Always-on CI on GitHub-hosted runners (no Unreal Engine needed):
#   - CrashCore (the engine-agnostic gameplay core that Unreal compiles too) on Linux/Windows/macOS + sanitizers
#   - headless AI battle simulation smoke test and a balance report
#   - game data validation (schema, references, localization, "no ranged equipment" rule)
#   - Go backend (vet, race tests against a real Postgres) and its Docker image
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
            generator: Ninja
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
            generator: Ninja
          - name: windows-msvc
            os: windows-latest
            cxx: ""
            generator: "" # CMake picks the newest installed Visual Studio
          - name: macos-clang
            os: macos-latest
            cxx: clang++
            generator: Ninja
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: matrix.generator == 'Ninja' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Install Ninja (macOS)
        if: matrix.generator == 'Ninja' && runner.os == 'macOS'
        run: brew install ninja || true
      - name: Configure
        shell: bash
        run: |
          ARGS=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          if [ -n "${{ matrix.generator }}" ]; then ARGS+=(-G "${{ matrix.generator }}"); fi
          if [ -n "${{ matrix.cxx }}" ]; then ARGS+=(-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}); fi
          cmake "${ARGS[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  core-sanitizers:
    name: Core (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++ -DBIGCAR_SANITIZE=ON
      - run: cmake --build build --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so formatting does not change with the runner image's clang-format.
      - name: Install clang-format 18
        run: |
          python3 -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install --quiet clang-format==18.1.8
          echo "$RUNNER_TEMP/cf/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          clang-format --version
          clang-format --dry-run --Werror Source/CrashCore/Public/CrashCore/*.h Source/CrashCore/Private/*.cpp Tests/Core/*.cpp Tests/Core/*.h Tools/crashsim/*.cpp

  simulation:
    name: AI battle simulation
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target crashsim --parallel
      - name: Smoke battles (gating)
        run: ./build/crashsim --data Content/BigCar/Data --smoke
      - name: Mode statistics
        run: |
          for mode in derby takedown team_elimination ring_out king_of_hill bounty; do
            ./build/crashsim --data Content/BigCar/Data --mode $mode --cars 6 --matches 20 --max-seconds 120 --seed 7 | tee -a sim-report.txt
          done
      - name: Per-tier duel balance report
        run: |
          for tier in 1 2 3 4 5; do
            echo "== tier $tier ==" | tee -a sim-report.txt
            ./build/crashsim --data Content/BigCar/Data --duels 2 --tier $tier --max-seconds 90 --csv duels-tier$tier.csv | tee -a sim-report.txt
          done
          {
            echo '### AI battle simulation'
            echo '```'
            cat sim-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: |
            sim-report.txt
            duels-tier*.csv

  data:
    name: Game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate content (schema, references, localization, melee-only rule)
        run: python3 Tools/validate_data.py --data-dir Content/BigCar/Data
      - name: graphics.json is generated from Tools/gen_graphics.py
        run: |
          python3 Tools/gen_graphics.py
          git diff --exit-code -- Content/BigCar/Data/graphics.json

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bigcar
          POSTGRES_PASSWORD: bigcar
          POSTGRES_DB: bigcar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bigcar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Backend/go.mod
          cache-dependency-path: Backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (race, real Postgres)
        env:
          BIGCAR_TEST_DATABASE_URL: postgres://bigcar:bigcar@localhost:5432/bigcar_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/bigcar-backend ./cmd/bigcar-backend

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bigcar-backend" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
